<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
<link rel="stylesheet" href="form.css">

</head>
<body>

    <div class="container">
        <h1>Student Registration Form</h1>

        <form>
            <fieldset>
                <legend>Student Registration Form</legend>

                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" placeholder="Enter your name" required autofocus>
                </div>

                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" placeholder="Enter password" minlength="8" maxlength="16" required>
                </div>

                <div class="form-group">
                    <label>Age:</label>
                    <input type="number" min="4" max="25" required>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="options">
                        <label><input type="radio" name="gender" checked> Male</label>
                        <label><input type="radio" name="gender"> Female</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Select Class:</label>
                    <select>
                        <option>Select class</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Hobbies:</label>
                    <div class="options">
                        <label><input type="checkbox" checked> Reading</label>
                        <label><input type="checkbox"> Sports</label>
                        <label><input type="checkbox"> Coding</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Date of Birth:</label>
                    <input type="date">
                </div>

                <div class="form-group">
                    <label>Favourite Color:</label>
                    <input type="color">
                </div>

                <div class="form-group">
                    <label>Upload Image:</label>
                    <input type="file" multiple>
                </div>

                <div class="form-group">
                    <label>Message:</label>
                    <textarea rows="4" placeholder="Write your message"></textarea>
                </div>

                <div class="submit-btn">
                    <input type="submit" value="Register Now">
                </div>

            </fieldset>
        </form>
    </div>

</body>
</html>
